<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.12/dist/sweetalert2.all.min.js"></script>
    <style>
        .carousel-container {
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .carousel-container::-webkit-scrollbar {
            display: none;
        }
        
        .card {
            transition: transform 0.3s ease-in-out;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }

        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal {
            transition: opacity 0.3s ease-in-out;
        }

        .carousel-button {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .carousel-button:hover {
            opacity: 1;
        }

        .slide-controls {
            position: absolute;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
            pointer-events: none;
        }

        .slide-controls button {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-60 hidden">
        <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-32 w-32"></div>
    </div>
    <!-- Create Event Modal -->
    <div id="createEventModal" class="modal fixed inset-0 z-40 hidden">
        <div class="fixed inset-0 bg-black bg-opacity-50"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold text-gray-800">Crear Nuevo Evento</h3>
                        <button onclick="closeCreateModal()" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <form id="createEventForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                            <input type="text" id="newNombre" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                            <textarea id="newDescripcion" rows="3" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio</label>
                                <input type="datetime-local" id="newFechaInicio" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Fin</label>
                                <input type="datetime-local" id="newFechaFin" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Poster</label>
                            <input type="file" id="newPoster" accept="image/*" class="w-full p-2 border rounded-lg">
                        </div>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-300">
                                Crear Evento
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Edit Event Modal -->
    <div id="eventModal" class="modal fixed inset-0 z-40 hidden">
        <div class="fixed inset-0 bg-black bg-opacity-50"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold text-gray-800">Detalles del Evento</h3>
                        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <form id="eventForm" class="space-y-4">
                        <input type="hidden" id="eventId">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                            <input type="text" id="nombre" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                            <textarea id="descripcion" rows="3" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio</label>
                                <input type="datetime-local" id="fechaInicio" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Fin</label>
                                <input type="datetime-local" id="fechaFin" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Poster</label>
                            <input type="file" id="poster" accept="image/*" class="w-full p-2 border rounded-lg">
                        </div>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button type="button" onclick="eliminarEvento()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition duration-300">
                                Eliminar
                            </button>
                            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-300">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-12 text-gray-800">Eventos Disponibles</h1>
        <!-- Add Create Event Button -->
        <div class="mb-6 ml-4">
            <button onclick="showCreateModal()" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 transition duration-300 flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Crear Nuevo Evento
            </button>
        </div>
        <div class="relative overflow-hidden">
            <div id="carousel" class="carousel-container flex gap-6 overflow-x-auto px-4 py-6">
                <!-- Cards will be inserted here dynamically -->
            </div>
            
            <div class="slide-controls top-1/2 transform -translate-y-1/2">
                <button id="prevButton" class="carousel-button bg-white p-3 rounded-full shadow-lg z-10 hover:bg-gray-100 focus:outline-none">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                
                <button id="nextButton" class="carousel-button bg-white p-3 rounded-full shadow-lg z-10 hover:bg-gray-100 focus:outline-none">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentEvent = null;

        function showLoading() {
            document.getElementById('loading-overlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loading-overlay').classList.add('hidden');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatDateForInput(dateString) {
            const date = new Date(dateString);
            return date.toISOString().slice(0, 16);
        }

        function showModal() {
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.add('hidden');
            currentEvent = null;
        }

        async function verDetalles(idEvento) {
            showLoading();
            try {
                const response = await fetch(`https://eventoempresaria-001-site1.dtempurl.com/api/Evento/ObtenerEventoPorId?id=${idEvento}`);
                if (!response.ok) throw new Error('Error al obtener el evento');
                
                const evento = await response.json();
                currentEvent = evento;

                document.getElementById('eventId').value = evento.idEvento;
                document.getElementById('nombre').value = evento.nombre;
                document.getElementById('descripcion').value = evento.descripcion;
                document.getElementById('fechaInicio').value = formatDateForInput(evento.fechaInicio);
                document.getElementById('fechaFin').value = formatDateForInput(evento.fechaFin);

                showModal();
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo cargar los detalles del evento', 'error');
            } finally {
                hideLoading();
            }
        }

        async function actualizarEvento(evento) {
            showLoading();
            try {
                const response = await fetch('https://eventoempresaria-001-site1.dtempurl.com/api/Evento/ActualizarEvento', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(evento)
                });

                if (!response.ok) throw new Error('Error al actualizar el evento');

                await Swal.fire('¡Éxito!', 'Evento actualizado correctamente', 'success');
                closeModal();
                loadEvents();
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo actualizar el evento', 'error');
            } finally {
                hideLoading();
            }
        }

        async function eliminarEvento() {
            const eventId = document.getElementById('eventId').value;
            
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                text: "Esta acción no se puede deshacer",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (result.isConfirmed) {
                showLoading();
                try {
                    const response = await fetch(`https://eventoempresaria-001-site1.dtempurl.com/api/Evento/EliminarEvento?id=${eventId}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Error al eliminar el evento');

                    await Swal.fire('¡Eliminado!', 'El evento ha sido eliminado', 'success');
                    closeModal();
                    loadEvents();
                } catch (error) {
                    console.error('Error:', error);
                    Swal.fire('Error', 'No se pudo eliminar el evento', 'error');
                } finally {
                    hideLoading();
                }
            }
        }

        function createEventCard(event) {
            const card = document.createElement('div');
            card.className = 'card flex-none w-80 bg-white rounded-xl shadow-lg overflow-hidden';
            
            const posterSrc = event.poster ? `data:${event.posterContentType};base64,${event.poster}` : '/api/placeholder/320/200';
            
            card.innerHTML = `
                <div class="relative h-48">
                    <img src="${posterSrc}" alt="${event.nombre}" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-gray-800 mb-2">${event.nombre}</h3>
                    <p class="text-gray-600 mb-4 line-clamp-2">${event.descripcion}</p>
                    <div class="space-y-2">
                        <p class="text-sm text-gray-500">
                            <span class="font-semibold">Inicio:</span> ${formatDate(event.fechaInicio)}
                        </p>
                        <p class="text-sm text-gray-500">
                            <span class="font-semibold">Fin:</span> ${formatDate(event.fechaFin)}
                        </p>
                    </div>
                    <div class="space-y-2 mt-4">
                        <button onclick="verDetalles(${event.idEvento})" 
                                class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-blue-600 transition duration-300">
                            Ver Detalles
                        </button>
                        <button onclick="gestionarEvento(${event.idEvento})" 
                                class="w-full bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 transition duration-300">
                            Gestionar Evento
                        </button>
                    </div>
                </div>
            `;
            
            return card;
        }

        async function loadEvents() {
            showLoading();
            try {
                const response = await fetch('https://eventoempresaria-001-site1.dtempurl.com/api/Evento/ObtenerEventos');
                if (!response.ok) throw new Error('Error al cargar los eventos');
                
                const events = await response.json();
                const carousel = document.getElementById('carousel');
                carousel.innerHTML = '';
                
                events.forEach(event => {
                    const card = createEventCard(event);
                    carousel.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudieron cargar los eventos', 'error');
            } finally {
                hideLoading();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadEvents();

            // Event form submission
            document.getElementById('eventForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const formData = new FormData(e.target);
                const evento = {
                    idEvento: document.getElementById('eventId').value,
                    nombre: document.getElementById('nombre').value,
                    descripcion: document.getElementById('descripcion').value,
                    fechaInicio: document.getElementById('fechaInicio').value,
                    fechaFin: document.getElementById('fechaFin').value,
                    poster: currentEvent?.poster,
                    posterContentType: currentEvent?.posterContentType
                };

                const posterInput = document.getElementById('poster');
                if (posterInput.files.length > 0) {
                    const file = posterInput.files[0];
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        evento.poster = e.target.result.split(',')[1];
                        evento.posterContentType = file.type;
                        await actualizarEvento(evento);
                    };
                    reader.readAsDataURL(file);
                } else {
                    await actualizarEvento(evento);
                }
            });

            // Carousel Controls
            const carousel = document.getElementById('carousel');
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');

            prevButton.addEventListener('click', () => {
                carousel.scrollBy({
                    left: -320,
                    behavior: 'smooth'
                });
            });

            nextButton.addEventListener('click', () => {
                carousel.scrollBy({
                    left: 320,
                    behavior: 'smooth'
                });
            });

            // Hide/show carousel controls based on scroll position
            carousel.addEventListener('scroll', () => {
                prevButton.style.display = carousel.scrollLeft <= 0 ? 'none' : 'block';
                nextButton.style.display = 
                    carousel.scrollLeft >= (carousel.scrollWidth - carousel.clientWidth) 
                    ? 'none' 
                    : 'block';
            });
            // Event handler for create event form
            document.getElementById('createEventForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const evento = {
                    nombre: document.getElementById('newNombre').value,
                    descripcion: document.getElementById('newDescripcion').value,
                    fechaInicio: document.getElementById('newFechaInicio').value,
                    fechaFin: document.getElementById('newFechaFin').value,
                };

                const posterInput = document.getElementById('newPoster');
                if (posterInput.files.length > 0) {
                    const file = posterInput.files[0];
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        evento.poster = e.target.result.split(',')[1];
                        evento.posterContentType = file.type;
                        await crearEvento(evento);
                    };
                    reader.readAsDataURL(file);
                } else {
                    await crearEvento(evento);
                }
            });
        });

        // Función para gestionar evento
        async function gestionarEvento(idEvento) {
            try {
                window.location.href = `/dashboard.html?id=${idEvento}`;
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo acceder a la gestión del evento', 'error');
            }
        }
        function showCreateModal() {
            document.getElementById('createEventModal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('createEventModal').classList.add('hidden');
            document.getElementById('createEventForm').reset();
        }

        async function crearEvento(evento) {
            showLoading();
            try {
                const response = await fetch('https://eventoempresaria-001-site1.dtempurl.com/api/Evento/GuardarEvento', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(evento)
                });

                if (!response.ok) throw new Error('Error al crear el evento');

                await Swal.fire('¡Éxito!', 'Evento creado correctamente', 'success');
                closeCreateModal();
                loadEvents();
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'No se pudo crear el evento', 'error');
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
